version: '3.8'

services:
  api_gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tzanix-neural-gateway-core
    ports:
      - "8000:8000"
    volumes:
      # Persistencia de la base de datos SQLite WAL local
      - ./fourier_ifa.db:/app/fourier_ifa.db
      # Mapeo del archivo de licencia criptográfica (solo lectura)
      - ./license.key:/app/license.key:ro
      # Montaje del UUID de hardware del host para entornos Linux/WSL2
      - /sys/class/dmi/id/product_uuid:/sys/class/dmi/id/product_uuid:ro
    environment:
      - ENVIRONMENT=production
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
